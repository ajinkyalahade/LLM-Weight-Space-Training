<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="What happened to each answer"><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--on4:#0b0b0b}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--on4:#ffffff}}
text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;fill:var(--ink2);font-size:12px}
.title{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--ink2)}.tick{fill:var(--muted);font-size:11px}
.val{fill:var(--ink);font-size:11px;font-variant-numeric:tabular-nums}.in{fill:#fff;font-size:11px;font-weight:600}
.in4{fill:var(--on4);font-size:11px;font-weight:600}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--axis);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}.l4{stroke:var(--s4)}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--surface);stroke-width:2}
</style>
<rect width="720" height="340" fill="var(--surface)"/>
<text class="title" x="20" y="28">What happened to each answer</text>
<text class="sub" x="20" y="47">64 answers per model, same problems, at most 16,384 new tokens each.</text>
<rect class="s1" x="20" y="60" width="10" height="10" rx="2"/><text x="35" y="69">Correct</text>
<rect class="s2" x="100.04" y="60" width="10" height="10" rx="2"/><text x="115.04" y="69">Wrong answer</text>
<rect class="s3" x="213.68" y="60" width="10" height="10" rx="2"/><text x="228.68" y="69">Finished, no answer</text>
<rect class="s4" x="374.36" y="60" width="10" height="10" rx="2"/><text x="389.36" y="69">Cut off at the token cap</text>
<text class="val" x="20" y="96" style="font-size:12px">Original</text>
<rect class="s1" x="21.0" y="104" width="83.0" height="28" rx="4"><title>Original — Correct: 8 answers (12%)</title></rect>
<text class="in" x="28.0" y="122">12%</text>
<rect class="s2" x="106.0" y="104" width="8.6" height="28" rx="4"><title>Original — Wrong answer: 1 answers (2%)</title></rect>
<rect class="s4" x="116.6" y="104" width="582.4" height="28" rx="4"><title>Original — Cut off at the token cap: 55 answers (86%)</title></rect>
<text class="in4" x="123.6" y="122">86%</text>
<text class="val" x="20" y="160" style="font-size:12px">Authors&#x27; edit</text>
<rect class="s1" x="21.0" y="168" width="221.1" height="28" rx="4"><title>Authors&#x27; edit — Correct: 21 answers (33%)</title></rect>
<text class="in" x="28.0" y="186">33%</text>
<rect class="s2" x="244.1" y="168" width="51.1" height="28" rx="4"><title>Authors&#x27; edit — Wrong answer: 5 answers (8%)</title></rect>
<text class="in" x="251.1" y="186">8%</text>
<rect class="s3" x="297.2" y="168" width="8.6" height="28" rx="4"><title>Authors&#x27; edit — Finished, no answer: 1 answers (2%)</title></rect>
<rect class="s4" x="307.9" y="168" width="391.1" height="28" rx="4"><title>Authors&#x27; edit — Cut off at the token cap: 37 answers (58%)</title></rect>
<text class="in4" x="314.9" y="186">58%</text>
<text class="val" x="20" y="224" style="font-size:12px">My edit A</text>
<rect class="s1" x="21.0" y="232" width="114.9" height="28" rx="4"><title>My edit A — Correct: 11 answers (17%)</title></rect>
<text class="in" x="28.0" y="250">17%</text>
<rect class="s4" x="137.9" y="232" width="561.1" height="28" rx="4"><title>My edit A — Cut off at the token cap: 53 answers (83%)</title></rect>
<text class="in4" x="144.9" y="250">83%</text>
<text class="val" x="20" y="288" style="font-size:12px">My edit M2</text>
<rect class="s1" x="21.0" y="296" width="263.6" height="28" rx="4"><title>My edit M2 — Correct: 25 answers (39%)</title></rect>
<text class="in" x="28.0" y="314">39%</text>
<rect class="s2" x="286.6" y="296" width="51.1" height="28" rx="4"><title>My edit M2 — Wrong answer: 5 answers (8%)</title></rect>
<text class="in" x="293.6" y="314">8%</text>
<rect class="s4" x="339.8" y="296" width="359.2" height="28" rx="4"><title>My edit M2 — Cut off at the token cap: 34 answers (53%)</title></rect>
<text class="in4" x="346.8" y="314">53%</text>
</svg>